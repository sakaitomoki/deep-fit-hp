kind = "web"
previewPath = "/"
title = "DEEP.FIT ウェブサイト"
version = "1.0.0"
id = "artifacts/deepfit-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18973

[services.development]
run = "pnpm --filter @workspace/deepfit-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/deepfit-website", "run", "build" ]
publicDir = "artifacts/deepfit-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18973"
BASE_PATH = "/"
